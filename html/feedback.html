<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Bakeology</title>
  <link rel="stylesheet" href="/style/feedback.css">
  <link rel="stylesheet" href="/style/general.css">
  <style>
    body {
      background: linear-gradient(135deg, #ecd8b9 0%, #fff1e6 100%);
      color: #222;
      padding: 40px 30px 15px;
      overflow-x: hidden;
    }

    .feedback-main {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .feedback-container {
      display: flex;
      margin-top: 10px;
      width: 790px;
      height: 490px;
      background: #fffdf8;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .feedback-left {
      flex: 1.4;
      padding: 30px 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .feedback-left h1 {
      font-size: 28px;
      color: #d2691e;
      margin-bottom: 8px;
    }

    .feedback-left p {
      color: #555;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .feedback-left label {
      font-size: 16px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #333;
    }

    .feedback-left input[type="text"],
    .feedback-left textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #f5a623;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      background-color: #fff;
      transition: 0.3s;
    }

    .feedback-left input:focus,
    .feedback-left textarea:focus {
      border-color: #f5a623;
      outline: none;
      box-shadow: 0 0 6px rgba(245,166,35,0.3);
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .radio-group input {
      margin-right: 6px;
      transform: scale(1.2);
      accent-color: #f5a623;
    }

    .submit-btn {
      background: linear-gradient(90deg, #f5a623, #d2691e);
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
    }

    .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 12px rgba(245,166,35,0.3);
    }

    .feedback-right {
      flex: 1;
      background: #f5a623;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .feedback-right img {
      width: 60%;
      max-width: 220px;
      margin-bottom: 15px;
      border-radius: 16px;
      background: white;
      padding: 8px;
    }

    .feedback-right h2 {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.3;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      background-color: #fff1e6;
      padding: 15px;
      font-size: 14px;
      color: #444;
      border-radius: 10px;
    }


    #feedbackNotification {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #4CAF50;
      color: white;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 0;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
      z-index: 10000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    @media (max-width: 950px) {
      .feedback-container {
        flex-direction: column;
        width: 95%;
        height: auto;
      }
      .feedback-left {
        padding: 20px 15px;
      }
      .feedback-right {
        padding: 15px;
      }
      #feedbackNotification {
        font-size: 14px;
        padding: 12px 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GolderBakes</div>
    <nav>
      <a href="product.html">Home</a>
      <a href="product.html">Products</a>
      <a href="recipe.html">Recipe</a>
      <a href="feedback.html" class="active">Feedback</a>
    </nav>
    <div class="account">
      <a id="acc" href="cart.html">Cart</a>
      <button class="register">Accounts</button>
    </div>
  </header>


  <div id="feedbackNotification"></div>

  <main class="feedback-main">
    <div class="feedback-container">
      <div class="feedback-left">
        <h1>We’d Love Your Feedback</h1>
        <p>Help us bake a better experience by sharing your thoughts and suggestions.</p>

        <form id="feedbackForm">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>

          <label>Are you a Bakeology customer?</label>
          <div class="radio-group">
            <label><input type="radio" name="isCustomer" value="yes" required> Yes</label>
            <label><input type="radio" name="isCustomer" value="no"> No</label>
          </div>

          <label for="feedback">Your Feedback</label>
          <textarea id="feedback" name="feedback" rows="5" placeholder="Tell us what you think..." required></textarea>

          <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
      </div>

      <div class="feedback-right">
        <img src="/images/logo.png" alt="Bakeology Feedback">
        <h2>“Baking smiles, one loaf at a time.”</h2>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Bakeology. All Rights Reserved.</p>
  </footer>

  <script>
    
    const feedbackForm = document.getElementById("feedbackForm");
    const feedbackNotification = document.getElementById("feedbackNotification");

    feedbackForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = feedbackForm.name.value.trim();
      if (!name) return;


      feedbackNotification.textContent = `Thank you, ${name}! Your feedback has been received.`;
      feedbackNotification.style.transform = "translateY(0)";

  
      setTimeout(() => {
        feedbackNotification.style.transform = "translateY(-100%)";
      }, 2000);

      feedbackForm.reset();
    });
  </script>
</body>
</html>
