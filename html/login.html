<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakeology Login</title>
  <link rel="stylesheet" href="/style/loginStyle.css">
  <style>
.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  width: 100%;
  padding-right: 40px;
  box-sizing: border-box;
}

.password-wrapper .eye-icon {
  position: absolute;
  top: 42%;
  right: 10px;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  cursor: pointer;
  z-index: 2;
  opacity: 0.8;
}

.password-wrapper .eye-icon:hover {
  opacity: 1;
}

.error-msg {
  color: red;
  font-size: 14px;
  margin-top: 4px;
}



  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>Welcome to <span>Bakeology</span></h2>
      <p class="subtitle">Freshly baked goodness, every login.</p>

      <form>
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

       <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <img src="/images/hide.png" class="eye-icon">
        </div>
        <div class="error-msg" id="passwordError"></div>


        <div class="options">
          <label><input id="check" type="checkbox"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>

        <div class="divider">or continue with</div>

        <div class="social-login">
          <button type="button" class="google">
            <img id="GImage" src="/images/google.png" alt="Google Logo"> Google
          </button>
          <button type="button" class="facebook">
            <img id="fbImage" src="/images/communication.png" alt="Facebook Logo"> Facebook
          </button>
        </div>

        <p class="bottom-text">
          Don’t have an account? <a href="register.html">Sign up</a>
        </p>
      </form>
    </div>

    <div class="image-section">
      <div id="login-btn">
        <button class="ex">Back to Home →</button>  
      </div>
      <img id="logo-img" src="/images/logo.png" alt="Bakery Image">
      <div class="image-overlay"></div>
      <div class="overlay-text">
        <h2>Start your day with love & butter</h2>
        <p>Freshly baked breads and pastries waiting just for you.</p>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
