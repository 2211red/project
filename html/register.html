<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeology Register</title>
  <link rel="stylesheet" href="/style/register.css" />
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>Create your <span>Bakeology</span> account</h2>
      <p class="subtitle">Join the sweetness today!</p>
<form id="registerForm">
  <label for="username">Username</label>
  <input type="text" id="username" placeholder="Enter your username" required>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter your email" required>

 <label for="password">Password</label>
<div class="password-wrapper">
  <input type="password" id="password" placeholder="Create a password" required>
  <img src="/images/hide.png" class="eye-icon">
</div>
<div class="error-msg" id="passwordError"></div>

<label for="confirmPassword">Confirm Password</label>
<div class="password-wrapper">
  <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
  <img src="/images/hide.png" class="eye-icon">
</div>
<div class="error-msg" id="confirmPasswordError"></div>

<div id="signInNotification" class="header-notification">
  <span id="signInNotificationText"></span>
</div>
<div id="successPopup" class="popup-overlay">
  <div class="popup-box">
    <h3>Account Successfully Created!</h3>
    <p>You can now log in using your account.</p>
    <button id="popupOkBtn">OK</button>
  </div>
</div>




  <button type="submit" class="btn-login">Sign Up</button>

  <div class="divider">or continue with</div>

  <div class="social-login">
    <button type="button" class="google">
      <img id="GImage" src="/images/google.png" alt="Google Logo">Google</button>
    <button type="button" class="facebook">
      <img id="fbImage" src="/images/communication.png" alt="Facebook Logo"> Facebook
    </button>
  </div>

  <p class="bottom-text">
    Already have an account? <a href="login.html">Sign in</a>
  </p>
</form>

    </div>

    <div class="image-section">
      <button class="ex">Back to Home →</button>
      <img id="logo-img" src="/images/logo.png" alt="Bakery Image" />
      <div class="image-overlay"></div>
      <div class="overlay-text">
        <h2>Start your day with love & butter</h2>
        <p>Freshly baked breads and pastries waiting just for you.</p>
      </div>
    </div>
  </div>

  <script src="/js/register.js"></script>
</body>
</html>
